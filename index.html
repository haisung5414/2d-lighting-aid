<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조명 시뮬레이터 2D v3.0</title>
    <style>
        :root {
            --left-sidebar-width: 280px;
            --sidebar-width: 360px;
            --header-height: 56px;
            --bg-panel: #f5f6f8;
            --bg-surface: #ffffff;
            --bg-surface-muted: #eef1f4;
            --border-color: #d7dce2;
            --text-main: #20242a;
            --text-muted: #64707d;
            --accent: #2f6fed;
            --accent-soft: #e8f0ff;
            --danger: #d64545;
        }
        * { box-sizing: border-box; }
        body { margin: 0; display: flex; height: 100vh; font-family: "Segoe UI", "Noto Sans KR", system-ui, sans-serif; overflow: hidden; background: #1c2026; color: var(--text-main); }
        
        #ui-left { width: var(--left-sidebar-width); background: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 10;}
        #ui-right { width: var(--sidebar-width); background: var(--bg-panel); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 10;}
        #main-container { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        #header { height: var(--header-height); background: var(--bg-surface); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 16px; gap: 12px; font-size: 0.84rem; flex-shrink: 0; z-index: 10; box-shadow: 0 1px 0 rgba(32, 36, 42, 0.04);}
        
        #canvas-wrapper { flex: 1; position: relative; overflow: hidden; background: #1f2329; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
        .grabbing { cursor: grabbing !important; }

        .panel-header { min-height: 48px; padding: 12px 14px; background: var(--bg-surface); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; }
        .panel-content { padding: 12px; overflow-y: auto; flex: 1; }
        .panel-section { border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; flex: 1; min-height: 0;}
        
        .list-item { padding: 10px; background: var(--bg-surface); border: 1px solid var(--border-color); margin-bottom: 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(20, 26, 34, 0.04); }
        .list-item:hover { border-color: #aeb8c4; background: #fbfcfd; }
        .list-item.active { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
        
        .btn { min-height: 30px; padding: 6px 11px; background: var(--accent); color: white; border: 1px solid transparent; border-radius: 6px; cursor: pointer; font-size: 0.82rem; font-weight: 650; display: flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap;}
        .btn:hover { background: #255fcf; }
        .btn-success { background: #2d7a52; } .btn-success:hover { background: #256744; }
        .btn-secondary { background: var(--bg-surface); color: var(--text-main); border-color: #c5ccd5; } .btn-secondary:hover { background: #edf1f5; }
        
        .btn-icon { min-width: 28px; min-height: 28px; background: transparent; border: 1px solid transparent; cursor: pointer; font-size: 0.86rem; padding: 2px 6px; border-radius: 5px; color: var(--text-muted); }
        .btn-icon:hover { background: #e9edf2; border-color: #c6ced8; color: var(--text-main); }
        .btn-danger { background: #fff; color: var(--danger); border: 1px solid #e3b3b3; padding: 4px 8px; font-size: 0.78rem; border-radius: 5px; cursor: pointer; font-weight: 700; }
        .btn-danger:hover { background: #fff1f1; border-color: var(--danger); }

        .control-group { margin-bottom: 10px; background: var(--bg-surface); padding: 11px; border: 1px solid var(--border-color); border-radius: 6px; box-shadow: 0 1px 2px rgba(20, 26, 34, 0.03); }
        .control-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 7px; font-weight: 650; }
        .control-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .control-row input { flex: 1; min-width: 0; width: 100%; padding: 6px 7px; border: 1px solid #c5ccd5; border-radius: 5px; background: #fff; color: var(--text-main); }
        input[type="range"] { width: 100%; }
        select { width: 100%; padding: 6px 7px; border: 1px solid #c5ccd5; border-radius: 5px; background: #fff; color: var(--text-main); }
        input:focus, select:focus, button:focus-visible { outline: 2px solid rgba(47, 111, 237, 0.28); outline-offset: 1px; border-color: var(--accent); }
        
        .top-input { width: 64px; padding: 5px 6px; border: 1px solid #c5ccd5; border-radius: 5px; background: #fff; }
        .toggle-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.84rem; cursor: pointer; color: var(--text-main); }
        .toggle-row input { margin-right: 8px; cursor: pointer; }

        #error-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: #ff5555; z-index: 9999; padding: 40px; box-sizing: border-box; overflow-y: auto; }
        #editor-screen { display: none; width: 100%; height: 100vh; min-width: 0; }
        #fixture-properties { flex: 0 0 auto; border-top: 1px solid var(--border-color); padding: 12px; background: #eef1f4; max-height: 48vh; overflow-y: auto; }
    </style>
</head>
<body>

<div id="error-screen"></div>

<section id="landing-screen" aria-labelledby="landing-title">
    <div class="landing-card">
        <div class="landing-title-row">
            <div>
                <p class="landing-kicker">조명 시뮬레이터 2D v3.0</p>
                <h1 id="landing-title">작업 공간 선택</h1>
            </div>
        </div>
        <div class="venue-grid" aria-label="Venue presets">
            <button class="venue-card" id="venue-sandbox" type="button" data-venue-key="sandbox">
                <span class="venue-card-title">Sandbox</span>
                <span class="venue-card-meta">빈 10m x 10m 무대</span>
            </button>
            <button class="venue-card venue-card-primary" id="venue-humanities" type="button" data-venue-key="humanities">
                <span class="venue-card-title">Humanities</span>
                <span class="venue-card-meta">12m x 22.7m 극장 도면</span>
            </button>
        </div>
        <div class="landing-actions">
            <button class="btn btn-secondary" id="landing-load-file" type="button">파일 불러오기</button>
        </div>
    </div>
</section>

<div id="editor-screen" aria-label="Lighting editor">
<aside id="ui-left">
    <div class="panel-section">
        <div class="panel-header">
            <span>씬</span>
            <button class="btn" onclick="addCue()">+ 추가</button>
        </div>
        <div class="panel-content" id="cue-list"></div>
    </div>
    <div id="set-panel"></div>
    <details class="collapsible-section view-options">
        <summary class="panel-header collapsible-summary">전체 보기 옵션</summary>
        <div class="collapsible-body">
            <label class="toggle-row"><input type="checkbox" id="tg-floor"> 바닥 영역 보기 (z=0)</label>
            <label class="toggle-row"><input type="checkbox" id="tg-face"> 얼굴 높이 영역 보기 (z=Actor)</label>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
            <label class="toggle-row"><input type="checkbox" id="tg-beam"> 빔 각도 보기</label>
            <label class="toggle-row"><input type="checkbox" id="tg-field"> 필드 각도 보기</label>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
            <label class="toggle-row"><input type="checkbox" id="tg-ref-humanities-floor-plan"> 극장 평면도 보기</label>
            <label class="toggle-row"><input type="checkbox" id="tg-ref-humanities-catwalk"> 캣워크 오버레이 보기</label>
        </div>
    </details>
</aside>

<main id="main-container">
    <header id="header">
        <strong style="font-size: 1.1em; margin-right: 10px;">조명 시뮬레이터 2D v3.0</strong>
        <div>폭 (m): <input type="number" id="stage-w" class="top-input" value="12"></div>
        <div>깊이 (m): <input type="number" id="stage-d" class="top-input" value="22.7"></div>
        <div>배우 높이 (m): <input type="number" id="actor-h" class="top-input" value="1.67" step="0.1"></div>
        <div>기본 Z (m): <input type="number" id="default-z" class="top-input" value="5.74" step="0.1"></div>
        <div style="display: flex; gap: 4px; align-items: center;">
            <button class="btn btn-secondary" onclick="zoomCanvas(1.2)">+</button>
            <button class="btn btn-secondary" onclick="zoomCanvas(1 / 1.2)">-</button>
            <button class="btn btn-secondary" onclick="resetCanvasZoom()">초기화</button>
        </div>
        <button class="btn btn-secondary" id="view3d-toggle" onclick="toggleView3D()">3D 보기</button>
        
        <div style="margin-left: auto; display: flex; gap: 10px;">
            <button class="btn btn-secondary" onclick="document.getElementById('file-upload').click()">파일 불러오기</button>
            <button class="btn btn-success" onclick="saveFile()">저장</button>
            <input type="file" id="file-upload" accept=".json" style="display:none" onchange="loadFile(event)">
        </div>
    </header>
    <div id="canvas-wrapper">
        <canvas id="stageCanvas"></canvas>
    </div>
</main>

<aside id="ui-right">
    <div class="panel-header" style="flex: 0 0 auto;">
        <span>조명 기구</span>
        <div class="fixture-add-controls">
            <select id="fixture-add-type" title="Fixture type">
                <option value="ellipsoidal">Fixed</option>
                <option value="zoom">Zoom</option>
                <option value="fresnel">Fresnel</option>
                <option value="par">PAR</option>
            </select>
            <button class="btn" onclick="addFixture()">+ 추가</button>
        </div>
    </div>
    <!-- 목록 영역: 스크롤 발생 -->
    <div class="panel-content" style="padding-bottom: 0;">
        <div id="fixture-list"></div>
    </div>
    <!-- 속성 패널 영역: 하단에 항상 고정 -->
    <div id="fixture-properties">
        <!-- 속성 컨트롤들이 여기에 렌더링됨 -->
    </div>
    <div id="patch-bay-panel"></div>
</aside>

</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
