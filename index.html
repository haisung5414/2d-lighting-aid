<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조명 시뮬레이터 2D v3.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>

<section id="landing-screen" aria-labelledby="landing-title">
    <div class="landing-card">
        <div class="landing-title-row">
            <div>
                <p class="landing-kicker">조명 시뮬레이터 2D v3.0</p>
                <h1 id="landing-title">작업 공간 선택</h1>
            </div>
        </div>
        <div class="venue-grid" aria-label="Venue presets">
            <button class="venue-card" id="venue-sandbox" type="button" data-venue-key="sandbox">
                <span class="venue-card-title">Sandbox</span>
                <span class="venue-card-meta">빈 10m x 10m 무대</span>
            </button>
            <button class="venue-card venue-card-primary" id="venue-humanities" type="button" data-venue-key="humanities">
                <span class="venue-card-title">Humanities</span>
                <span class="venue-card-meta">12m x 22.7m 극장 도면</span>
            </button>
        </div>
        <div class="landing-actions">
            <button class="btn btn-secondary" id="landing-load-file" type="button">파일 불러오기</button>
        </div>
    </div>
</section>

<div id="editor-screen" aria-label="Lighting editor">
  <div id="canvas-wrapper">
    <canvas id="stageCanvas"></canvas>

    <!-- 왼쪽 위: 파일 -->
    <div class="float filepill">
      <div class="menu-wrap">
        <button class="ibtn" id="file-menu-btn" type="button" aria-label="메뉴" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="float file-menu" id="file-menu" role="menu" hidden>
          <button type="button" role="menuitem" data-menu="workspace">홈으로</button>
          <button type="button" role="menuitem" data-menu="load">불러오기</button>
          <button type="button" role="menuitem" data-menu="save">저장</button>
          <button type="button" role="menuitem" data-menu="saveas">다른 이름으로 저장</button>
        </div>
      </div>
      <button type="button" class="filename" id="file-name" title="눌러서 이름 바꾸기">이름 없는 작업</button>
      <button class="ibtn" id="undo-btn" type="button" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
      </button>
      <button class="ibtn" id="redo-btn" type="button" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
      </button>
      <span class="savestate" id="save-state">내 컴퓨터</span>
      <input type="file" id="file-upload" accept=".json" hidden>
    </div>

    <!-- 위 가운데: 2D/3D -->
    <div class="float viewswitch" role="group" aria-label="보기 전환">
      <button type="button" id="view-2d" aria-pressed="true">2D 평면</button>
      <button type="button" id="view-3d" aria-pressed="false">3D 보기</button>
    </div>

    <!-- 오른쪽 위: 계정. 로그인은 src/cloud가 맡는다 (공유는 나중 기능) -->
    <div class="float account" id="account">
      <button type="button" class="pillbtn" id="login-btn" disabled title="나중에 지원합니다">로그인</button>
      <button type="button" class="pillbtn" disabled title="나중에 지원합니다">공유</button>
    </div>

    <!-- 왼쪽: 도구 -->
    <nav class="float toolrail" aria-label="도구"></nav>

    <!-- 오른쪽: 패널 트레이. 누른 항목 바로 아래에서 패널이 펼쳐지고 아래 항목은 밀려난다 (SketchUp 방식) -->
    <div class="tray" id="tray">
      <!-- 조명 설정: 조명을 고를 때마다 맨 위에서 펼쳐진다 -->
      <section class="float panel light-settings" id="light-settings" aria-label="조명 설정" hidden>
        <header><h2 id="light-settings-title">조명 설정</h2>
          <div class="hdr-actions"><button type="button" class="del-btn small" id="light-settings-delete" title="이 조명을 지웁니다 (실행 취소로 되돌릴 수 있음)">조명 삭제</button><button type="button" class="ibtn" id="light-settings-close" aria-label="닫기">✕</button></div></header>
        <div class="panel-body"><div id="light-settings-body"></div>
          <label class="toggle-row toggle-quiet"><input type="checkbox" id="light-settings-no-auto"> 조명을 누를 때 자동으로 열지 않기</label></div>
      </section>

      <div class="grp">선택한 것</div>
      <div class="tray-entry">
        <button type="button" class="trayitem" data-tray="props" aria-expanded="false"><span class="lbl">선택한 객체 속성</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg></span></button>
        <section class="float panel" data-panel="props" hidden>
          <div class="panel-body"><div id="props-body"></div>
            <label class="toggle-row toggle-quiet"><input type="checkbox" id="props-no-auto"> 객체를 누를 때 자동으로 열지 않기</label></div>
        </section>
      </div>


      <div class="tray-entry">
        <button type="button" class="trayitem" data-tray="help" aria-expanded="false"><span class="lbl">도우미</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 1-1 1.7M12 17h.01"/></svg></span></button>
        <section class="float panel" data-panel="help" hidden>
          <div class="panel-body" id="help-body"></div>
        </section>
      </div>

      <div class="grp">작업 전체</div>
      <div class="tray-entry">
        <button type="button" class="trayitem" data-tray="display" aria-expanded="false"><span class="lbl">빛 범위 표시</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span></button>
        <section class="float panel" data-panel="display" hidden>
          <div class="panel-body">
            <label class="toggle-row"><input type="checkbox" id="tg-floor"> 바닥에 닿는 빛 (가운데일수록 진하게)</label>
            <label class="toggle-row"><input type="checkbox" id="tg-face"> 배우 얼굴 높이에 닿는 빛</label>
            <label class="inline-num">표시할 얼굴 높이 <input type="number" id="actor-h" value="1.67" step="0.05" min="0.3" max="3"> m</label>
            <div class="sub-row">
              <span class="sub">각도선</span>
              <span class="info" tabindex="0" aria-describedby="beam-field-tip">
                <span class="info-icon" aria-hidden="true">i</span>
                <span class="info-tip" role="tooltip" id="beam-field-tip">
                  <b>빔 각도</b>: 조명 한가운데 밝기의 절반(50%)이 되는 경계입니다. 이 안쪽은 고르게 밝습니다.<br>
                  <b>필드 각도</b>: 밝기가 한가운데의 10%로 줄어드는 경계입니다. 빛이 닿는 바깥 끝이라고 보면 됩니다.<br>
                  무대에서는 빔 안쪽에 배우를 세우면 밝기가 고르고, 필드 근처에서는 어두워집니다.
                </span>
              </span>
            </div>
            <label class="toggle-row"><input type="checkbox" id="tg-beam"> 빔 각도선 (밝기 50% 경계, 실선)</label>
            <label class="toggle-row"><input type="checkbox" id="tg-field"> 필드 각도선 (밝기 10% 경계, 점선)</label>
          </div>
        </section>
      </div>
      <div class="tray-entry">
        <button type="button" class="trayitem" data-tray="venue3d" aria-expanded="false" disabled title="3D 보기에서 쓸 수 있습니다"><span class="lbl">3D 극장 구조</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg></span></button>
        <section class="float panel" data-panel="venue3d" hidden>
          <div class="panel-body">
            <label class="toggle-row"><input type="checkbox" data-venue3d="venue" checked> 극장 구조 (벽·천장·갤러리·조정실 앞 단)</label>
            <label class="toggle-row"><input type="checkbox" data-venue3d="catwalk"> 캣워크</label>
            <label class="toggle-row"><input type="checkbox" data-venue3d="seating" checked> 객석</label>
            <label class="toggle-row"><input type="checkbox" data-venue3d="worklight" checked> 작업등 (공간 전체를 약하게 밝힘)</label>
            <label class="toggle-row toggle-quiet"><input type="checkbox" id="venue3d-no-auto"> 3D로 들어갈 때 자동으로 열지 않기</label>
          </div>
        </section>
      </div>
      <div class="tray-entry">
        <button type="button" class="trayitem" data-tray="layers" aria-expanded="false"><span class="lbl">레이어</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></span></button>
        <section class="float panel" data-panel="layers" hidden>
          <div class="panel-body">
            <label class="toggle-row"><input type="checkbox" id="tg-ref-humanities-floor-plan"> 극장 평면도 보기</label>
            <label class="toggle-row"><input type="checkbox" id="tg-ref-humanities-catwalk"> 캣워크 오버레이 보기</label>
            <div id="bg-settings-container"></div>
          </div>
        </section>
      </div>
      <div class="tray-entry">
        <button type="button" class="trayitem" data-tray="patch" aria-expanded="false"><span class="lbl">채널 검사</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16M15 4v16"/></svg></span></button>
        <section class="float panel" data-panel="patch" hidden>
          <div class="panel-body"><div id="patch-bay-panel"></div></div>
        </section>
      </div>
      <div class="tray-entry">
        <button type="button" class="trayitem" data-tray="venue" aria-expanded="false"><span class="lbl">공연장 정보</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V9l9-5 9 5v11"/><path d="M8 20v-6h8v6"/></svg></span></button>
        <section class="float panel" data-panel="venue" hidden>
          <div class="panel-body venue-fields">
            <label>무대 폭 (m) <input type="number" id="stage-w" value="12" step="0.1"></label>
            <label>무대 깊이 (m) <input type="number" id="stage-d" value="22.7" step="0.1"></label>
            <label>기본 조명 높이 (m) <input type="number" id="default-z" value="5.74" step="0.1"></label>
            <label>램프 규격
              <select id="venue-lamp">
                <option value="HPL750_230">HPL 750W / 230V</option>
                <option value="HPL575_230">HPL 575W / 230V</option>
              </select>
            </label>
          </div>
        </section>
      </div>
      <div class="tray-entry">
        <button type="button" class="trayitem" data-tray="list" aria-expanded="false"><span class="lbl">객체 전체 목록</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></span></button>
        <section class="float panel" data-panel="list" hidden>
          <div class="panel-body" id="list-body"></div>
        </section>
      </div>
    </div>

    <!-- 아래: 씬 서랍 -->
    <div class="float scenes" id="scene-drawer">
      <button type="button" class="scenes-handle" id="scene-handle" aria-expanded="false">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 15 6-6 6 6"/></svg>
        <b>씬</b><span id="scene-current"></span><small id="scene-meta"></small>
      </button>
      <div class="scenes-body" id="scene-body" hidden>
        <div id="cue-list"></div>
        <div class="btnrow">
          <button type="button" class="sbtn" id="scene-add">＋ 새 씬</button>
          <button type="button" class="sbtn" id="scene-copy" title="지금 씬을 바로 뒤에 복사합니다 (조명 구성 포함)">복사</button>
          <button type="button" class="sbtn" id="scene-rename" title="지금 씬의 이름을 카드에서 바로 고칩니다">이름 변경</button>
          <button type="button" class="sbtn danger" id="scene-delete">삭제</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 상태 바 -->
  <footer class="statusbar">
    <button type="button" class="ibtn" id="help-btn" title="도우미 열기" aria-label="도우미 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 1-1 1.7M12 17h.01"/></svg></button>
    <span class="hint" id="tool-hint">선택: 조명·세트·사람 모형을 눌러 고르고 끌어서 옮기세요. 빈 곳을 끌면 화면이 움직이고, 휠로 확대·축소합니다.</span>
    <span class="cursorpos" id="cursor-pos" title="커서 위치 (무대 왼쪽 위 기준)">X —  Y —</span>
    <div class="vcb"><label id="vcb-label" for="vcb">수치</label><input id="vcb" type="text" autocomplete="off" spellcheck="false" placeholder="예: 2.5"></div>
    <div class="zoomctl">
      <button type="button" class="ibtn" id="zoom-out" aria-label="축소">−</button>
      <button type="button" class="zoom" id="zoom-fit" title="무대 전체 보기">100%</button>
      <button type="button" class="ibtn" id="zoom-in" aria-label="확대">＋</button>
    </div>
  </footer>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
