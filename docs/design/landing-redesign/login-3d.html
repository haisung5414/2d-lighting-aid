<title>Lighting Aid 3D 로그인 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Unbounded:wght@300;400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* 레이아웃: 지금 로그인 화면(왼쪽 그림 + 오른쪽 패널)에서 왼쪽 그림 자리에 실제 3D 무대를 넣는다.
   스스로 움직이지 않고, 끌었을 때만 돌아간다. 3D 장면 색은 앱의 3D 보기(view3d.ts) 값을 따른다. */
:root {
  --surface: #ffffff;
  --ink: #222831;
  --meta: #6b7280;
  --line: #e1e4e8;
  --accent: #0b5cad;
  --accent-hover: #ecf2fa;
  --stage: #0d0f12;          /* view3d.ts DARK_BACKGROUND */
  --stage-ink: #eef2f6;
  --stage-meta: #a5b1be;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --wide: "Unbounded", "IBM Plex Sans KR", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --surface: #222b35; --ink: #e4eaf0; --meta: #a5b1be; --line: #36414e; --accent: #6aa8ff; --accent-hover: #1c2d42; color-scheme: dark; }
}
:root[data-theme="dark"] { --surface: #222b35; --ink: #e4eaf0; --meta: #a5b1be; --line: #36414e; --accent: #6aa8ff; --accent-hover: #1c2d42; color-scheme: dark; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font); font-size: 15px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.sw { position: fixed; z-index: 50; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: #222831; color: #c9d1da; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.sw button { border: 0; background: none; color: inherit; height: 32px; padding: 0 13px; border-radius: 999px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.sw button b { font-family: var(--mono); font-weight: 500; margin-right: 6px; }
.sw button[aria-pressed="true"] { background: #eef2f6; color: #14181e; }
.sw i { width: 1px; height: 18px; background: rgba(255,255,255,.2); margin: 0 4px; }

/* ---------- 공통: 지금 로그인 구조 ---------- */
.login { display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--surface); }
.hero { flex: 999 1 560px; min-width: 0; position: relative; overflow: hidden; min-height: 380px; background: var(--stage); color: var(--stage-ink); }
.view { position: absolute; inset: 0; }
.view canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
.view canvas:active { cursor: grabbing; }
.hero-text { position: absolute; z-index: 2; left: max(64px, env(safe-area-inset-left, 0px)); right: 64px; bottom: 64px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.hero-line { font-size: clamp(36px, 5.2vw, 64px); line-height: 1.1; letter-spacing: -.02em; text-shadow: 0 2px 24px rgba(0,0,0,.5); }
.hero-line.strong { font-weight: 700; }
.hero-rule { display: block; height: 3px; max-width: 640px; margin-top: 30px; background: var(--accent); }
.tag { position: absolute; z-index: 2; display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; color: var(--stage-meta);
  padding: 6px 10px; background: rgba(13,15,18,.72); border: 1px solid rgba(255,255,255,.12); pointer-events: none; }
.tag b { color: var(--stage-ink); font-weight: 500; }
.tag.tl { top: calc(24px + env(safe-area-inset-top, 0px)); left: max(24px, env(safe-area-inset-left, 0px)); }
.tag.tr { top: calc(24px + env(safe-area-inset-top, 0px)); right: 24px; }
.signin { flex: 1 1 380px; max-width: 520px; box-sizing: border-box; border-left: 1px solid var(--line); display: flex; flex-direction: column; background: var(--surface); color: var(--ink);
  padding-block: calc(96px + env(safe-area-inset-top, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)); padding-left: 48px; padding-right: max(48px, env(safe-area-inset-right, 0px)); }
.logo { font-family: var(--wide); font-weight: 300; font-size: 26px; letter-spacing: -.02em; }
.sub { margin: 6px 0 0; font-size: 14px; color: var(--meta); }
.tagline { display: flex; flex-direction: column; font-size: 28px; font-weight: 500; line-height: 1.3; letter-spacing: -.01em; }
.p1 .signin h1 { display: none; }

/* ---------- 오른쪽 패널: 옅은 도면 격자 ---------- */
.signin { position: relative; isolation: isolate; }
.deco { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
/* R1 도면 격자: 1 m 칸, 5 m마다 진한 선 */
.r1 .deco { background-image:
  linear-gradient(color-mix(in srgb, var(--accent) 16%, transparent) 1px, transparent 1px),
  linear-gradient(90deg, color-mix(in srgb, var(--accent) 16%, transparent) 1px, transparent 1px),
  linear-gradient(color-mix(in srgb, var(--accent) 7%, transparent) 1px, transparent 1px),
  linear-gradient(90deg, color-mix(in srgb, var(--accent) 7%, transparent) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; background-position: -1px -1px;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 55%, transparent 100%); mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 55%, transparent 100%); }
.p1 .google { margin-top: 40px; }
.tagline b { font-weight: 700; }
/* P1: 왼쪽 큰 글씨는 앱 이름 */
.p1 #line-1 { font-family: var(--wide); font-weight: 300; font-size: clamp(40px, 6vw, 76px); letter-spacing: -.035em; }
.p1 #line-2 { font-weight: 400; font-size: clamp(18px, 2vw, 24px); letter-spacing: .02em; color: var(--stage-meta); margin-top: 8px; }
.signin h1 { margin: 40px 0 0; font-size: 30px; font-weight: 500; }
.google { margin-top: 32px; height: 48px; display: flex; align-items: center; justify-content: center; gap: 12px; border: 1px solid var(--ink); background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer; }
.google:hover { background: var(--accent-hover); }
.google svg { width: 20px; height: 20px; }
.skip { margin-top: 20px; border: 0; background: none; color: var(--accent); font-size: 15px; cursor: pointer; padding: 6px; }
.skip:hover { text-decoration: underline; }
.grow { flex: 1; }
.foot { display: flex; justify-content: center; font-size: 14px; }
.foot a { color: var(--accent); }

/* ---------- P2: 2D와 3D를 나란히 ---------- */
.pane-labels { position: absolute; inset: 0; z-index: 2; display: grid; grid-template-columns: 38fr 62fr; pointer-events: none; }
.pane-labels > div { position: relative; border-right: 1px solid rgba(255,255,255,.12); }
.pane-labels > div:last-child { border-right: 0; }
.pane-labels .tag { top: calc(24px + env(safe-area-inset-top, 0px)); left: 24px; }
.pane-labels .arrow { position: absolute; z-index: 3; top: 50%; right: -16px; width: 32px; height: 32px; margin-top: -16px; border-radius: 50%; display: grid; place-items: center; background: var(--stage-ink); color: #14181e; font-size: 15px; }
.p2 .hero-text { left: calc(38% + 40px); }

/* ---------- P3: 객석 시점, 패널을 무대 위에 ---------- */
.p3 .hero { flex-basis: 100%; min-height: 100vh; }
.p3 .signin { position: absolute; z-index: 3; top: calc(32px + env(safe-area-inset-top, 0px)); right: max(32px, env(safe-area-inset-right, 0px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  width: 400px; max-width: calc(100vw - 64px); border: 1px solid var(--line); padding: 48px 40px 28px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
.p3 .hero-text { right: 480px; }

@media (max-width: 960px) {
  .hero { min-height: 340px; }
  .hero-text { left: max(24px, env(safe-area-inset-left, 0px)); right: 24px; bottom: 32px; }
  .p2 .hero-text { left: max(24px, env(safe-area-inset-left, 0px)); }
  .pane-labels .tag { display: none; }
  .signin { max-width: none; border-left: 0; border-top: 1px solid var(--line); padding: 40px max(24px, env(safe-area-inset-right, 0px)) 90px max(24px, env(safe-area-inset-left, 0px)); }
  .p3 .hero { min-height: 420px; }
  .p3 .signin { position: static; width: auto; max-width: none; box-shadow: none; border-width: 1px 0 0; padding: 40px max(24px, env(safe-area-inset-right, 0px)) 90px max(24px, env(safe-area-inset-left, 0px)); }
  .p3 .hero-text { right: 24px; }
}
@media (max-width: 760px) { .sw button { padding: 0 10px; } .tag.tr { display: none; } }
</style>

<nav class="sw" aria-label="시안 선택">
  <button data-v="p1" aria-pressed="true"><b>P1</b>3D 한 장면</button>
  <button data-v="p2" aria-pressed="false"><b>P2</b>2D → 3D</button>
  <button data-v="p3" aria-pressed="false"><b>P3</b>객석 시점</button>
</nav>

<div class="login p1" id="login">
  <section class="hero" id="hero">
    <div class="view" id="view"></div>
    <div class="pane-labels" id="panes" hidden>
      <div><span class="tag"><b>2D</b> 평면도</span><span class="arrow">→</span></div>
      <div><span class="tag"><b>3D</b> 보기 · 끌어서 돌리기</span></div>
    </div>
    <span class="tag tl" id="tag-l"></span>
    <span class="tag tr" id="tag-r">끌어서 돌려 보기</span>
    <div class="hero-text">
      <span class="hero-line" id="line-1"></span>
      <span class="hero-line strong" id="line-2"></span>
      <span class="hero-rule"></span>
    </div>
  </section>
  <section class="signin r1" id="signin">
    <div class="deco" aria-hidden="true"></div>
    <div class="logo">Lighting Aid</div>
    <p class="sub">조명 시뮬레이터</p>
    <div class="tagline" id="tagline" hidden><span>무대 조명을</span><b>미리 그려 보세요.</b></div>
    <h1>환영합니다</h1>
    <button class="google"><svg viewBox="0 0 24 24"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z" fill="#4285F4"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" fill="#34A853"/><path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1A10 10 0 0 0 2 12c0 1.6.4 3.1 1.1 4.6z" fill="#FBBC05"/><path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.4 3-4.1 5.6-4.1z" fill="#EA4335"/></svg>Google로 계속 진행</button>
    <button class="skip">로그인 없이 시작하기 (이 기기에 저장)</button>
    <div class="grow"></div>
    <div class="foot"><a href="#p1">개인정보처리방침</a></div>
  </section>
</div>

<script>
(() => {
const COPY = {
  p1: ['Lighting Aid', '조명 시뮬레이터', '<b>3D 보기</b> · 두레문예관 무대'],
  p2: ['평면도에 그리면', '3D로 바로 보입니다.', ''],
  p3: ['객석에서 볼 무대를', '미리 확인하세요.', '<b>객석 7열</b> 시점 · 눈높이 1.2 m'],
};
const login = document.getElementById('login'), view = document.getElementById('view');
let cur = 'p1';
if (!window.THREE) { view.textContent = ''; }
const T = window.THREE;

/* ---------- 3D 무대 (단위 m). 장면은 하나, 시안마다 카메라만 다르다 ---------- */
let renderer, scene, persp, top, target, orbit = { th: .55, ph: .32, r: 15 };
if (T) {
  renderer = new T.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setClearColor(0x0d0f12);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
  view.append(renderer.domElement);
  scene = new T.Scene();
  scene.fog = new T.Fog(0x0d0f12, 22, 46);
  const std = (c, r = .85) => new T.MeshStandardMaterial({ color: c, roughness: r, metalness: 0 });
  const add = (geo, mat, x, y, z, shadow = true) => { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.receiveShadow = shadow; m.castShadow = shadow; scene.add(m); return m; };

  add(new T.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), std(0x16181c), 0, 0, 4);                     // 객석 바닥
  add(new T.BoxGeometry(12, .9, 8), std(0x3a3631, .7), 0, .45, 0);                                       // 무대
  add(new T.BoxGeometry(16, 8, .2), std(0x4d4d52, .95), 0, 4, -4.3, false).receiveShadow = true;         // 뒷벽(사이클로라마), venueModel WALL_COLOR
  for (const s of [-1, 1]) for (const z of [-2.6, -.2, 2.2]) add(new T.BoxGeometry(.08, 7, 1.3), std(0x333337, 1), s * 6.2, 3.5, z); // 다리막, CURTAIN_COLOR
  const pipe = add(new T.CylinderGeometry(.04, .04, 14, 8).rotateZ(Math.PI / 2), new T.MeshStandardMaterial({ color: 0x9aa0a6, metalness: .6, roughness: .4 }), 0, 7.2, 1.6, false);
  // 배우 (키 1.67 m, view3d SKIN_COLOR)
  const skin = std(0xc9a48a, .6);
  add(new T.CylinderGeometry(.2, .24, 1.0, 16), std(0x2a3340, .8), .4, .9 + .5, .4);
  add(new T.CylinderGeometry(.24, .2, .5, 16), std(0x2a3340, .8), .4, .9 + 1.15, .4);
  add(new T.SphereGeometry(.13, 20, 16), skin, .4, .9 + 1.54, .4);
  add(new T.BoxGeometry(.5, .45, .45), std(0x5a4636, .8), -1.6, .9 + .225, -.6);                         // 의자
  // 객석 (P3에서 보인다): 계단식 10열, SEAT_COLOR
  for (let r = 0; r < 10; r++) for (let c = -7; c <= 7; c++) { if (c === 0) continue; add(new T.BoxGeometry(.5, .45, .45), std(0x564c4c, .9), c * .58, .23 + r * .28, 7 + r * .95); }

  scene.add(new T.HemisphereLight(0x8899aa, 0x222222, .18));
  // 조명기: [색, 세기, 위치, 비출 곳, 각도, 빔 보이기]
  const beams = [];
  const fixture = (col, k, from, to, ang, beam = true) => {
    const L = new T.SpotLight(col, k, 30, ang, .55, 1.4);
    L.position.set(...from); L.target.position.set(...to); L.castShadow = true; L.shadow.mapSize.set(1024, 1024); L.shadow.bias = -.0005;
    scene.add(L, L.target);
    // 기구 몸통
    const body = add(new T.BoxGeometry(.28, .28, .5), std(0x30343a, .5), ...from, false);
    body.lookAt(new T.Vector3(...to));
    if (!beam) return;
    // 헤이즈 속 빔: 끝이 열린 원뿔 두 겹, 더하기 합성으로 흐리게
    const a = new T.Vector3(...from), b = new T.Vector3(...to), dir = b.clone().sub(a), len = dir.length(); dir.normalize();
    for (const [scale, op] of [[1, .018], [.75, .022], [.5, .026]]) {
      const geo = new T.ConeGeometry(Math.tan(ang) * len * scale, len, 40, 1, true);
      const m = new T.Mesh(geo, new T.MeshBasicMaterial({ color: col, transparent: true, opacity: op, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide }));
      m.quaternion.setFromUnitVectors(new T.Vector3(0, -1, 0), dir);
      m.position.copy(a).addScaledVector(dir, len / 2);
      scene.add(m); beams.push(m);
    }
  };
  fixture(0xfff1dc, 2.6, [0, 7.2, 1.6], [.4, .9, .4], .17);              // 센터 스페셜
  fixture(0xf5b841, 1.7, [-5.2, 7.2, 1.6], [-1.6, .9, -.3], .3);          // 앰버 사이드
  fixture(0xf5b841, 1.4, [5.2, 7.2, 1.6], [2.2, .9, .2], .3);
  fixture(0x6aa8ff, 1.6, [0, 7, -3.6], [0, .9, 1.4], .42);                // 블루 백라이트
  fixture(0xd648a0, .9, [3.5, 7, -3.4], [-1, .9, .6], .36);
  fixture(0x285ac8, 2.2, [0, 1.1, -2.8], [0, 6.5, -4.2], .62, false);    // 사이클 그라운드 로

  target = new T.Vector3(0, 1.6, .2);
  persp = new T.PerspectiveCamera(50, 1, .1, 120);   // view3d.ts와 같은 화각
  top = new T.OrthographicCamera(-8, 8, 6, -6, .1, 50);
  top.position.set(0, 20, .4); top.up.set(0, 0, -1); top.lookAt(0, 0, .4);
}

const CAM = { p1: { th: .62, ph: .3, r: 14.5 }, p2: { th: .5, ph: .36, r: 15.5 }, p3: { th: 0, ph: .09, r: 14.6 } };
const placeCamera = () => {
  const { th, ph, r } = orbit;
  persp.position.set(target.x + Math.sin(th) * Math.cos(ph) * r, target.y + Math.sin(ph) * r, target.z + Math.cos(th) * Math.cos(ph) * r);
  persp.lookAt(target);
};
const render = () => {
  if (!renderer) return;
  const w = view.clientWidth, h = view.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false);
  renderer.setScissorTest(cur === 'p2');
  if (cur === 'p2') {
    // 왼쪽 38%: 위에서 내려다본 평면도, 오른쪽: 3D
    const lw = Math.round(w * .38);
    const asp = lw / h; top.left = -6 * asp; top.right = 6 * asp; top.top = 6; top.bottom = -6; top.zoom = asp < 1.1 ? .95 : 1.25; top.updateProjectionMatrix();
    renderer.setViewport(0, 0, lw, h); renderer.setScissor(0, 0, lw, h); renderer.render(scene, top);
    persp.aspect = (w - lw) / h; persp.updateProjectionMatrix(); placeCamera();
    renderer.setViewport(lw, 0, w - lw, h); renderer.setScissor(lw, 0, w - lw, h); renderer.render(scene, persp);
  } else {
    renderer.setViewport(0, 0, w, h);
    persp.aspect = w / h; persp.updateProjectionMatrix(); placeCamera();
    renderer.render(scene, persp);
  }
};

// 끌었을 때만 돌아간다. 스스로 움직이는 일은 없다
if (renderer) {
  const cv = renderer.domElement; let drag = null;
  cv.addEventListener('pointerdown', (e) => {
    if (cur === 'p2' && e.offsetX < view.clientWidth * .38) return;
    drag = { x: e.clientX, y: e.clientY, th: orbit.th, ph: orbit.ph }; cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', (e) => {
    if (!drag) return;
    orbit.th = Math.max(-1.2, Math.min(1.2, drag.th - (e.clientX - drag.x) * .005));
    orbit.ph = Math.max(.04, Math.min(1.2, drag.ph + (e.clientY - drag.y) * .004));
    requestAnimationFrame(render);
  });
  const end = () => { drag = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  new ResizeObserver(() => requestAnimationFrame(render)).observe(view);
}

const show = (k) => {
  if (!COPY[k]) k = 'p1';
  cur = k; login.className = 'login ' + k;
  const [a, b, tag] = COPY[k];
  document.getElementById('line-1').textContent = a; document.getElementById('line-2').textContent = b;
  // P1: 왼쪽 큰 글씨에 앱 이름, 오른쪽 패널 위에 소개 문구 (서로 자리를 바꿨다)
  const swap = k === 'p1';
  document.querySelector('.signin .logo').hidden = swap; document.querySelector('.signin .sub').hidden = swap;
  document.getElementById('tagline').hidden = !swap;
  const tl = document.getElementById('tag-l'); tl.innerHTML = tag; tl.hidden = !tag;
  document.getElementById('tag-r').hidden = k === 'p2';
  document.getElementById('panes').hidden = k !== 'p2';
  document.querySelectorAll('.sw button[data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === k)));
  document.querySelector('.foot a').href = '#' + k;
  Object.assign(orbit, CAM[k]);
