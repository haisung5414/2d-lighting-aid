<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>글꼴 비교</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=IBM+Plex+Sans+KR:wght@400;500;700&amp;family=Nanum+Gothic:wght@400;700&amp;family=Gothic+A1:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E6E8EB}
</style>
</helmet>
<div style="width: 1040px; height: 900px; box-sizing: border-box; padding: 40px; background: #E6E8EB; font-family: 'Noto Sans KR', sans-serif; color: #222831; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700">글꼴 비교</h1>
<p style="margin: 0; font-size: 14px; color: #5E6670">같은 UI 문구를 네 가지 글꼴로 나란히 보여 줍니다. 마음에 드는 글꼴은 각 화면의 Tweaks에서 바로 적용해 볼 수 있습니다.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; flex: 1">
<sc-for list="{{fonts}}" as="f" hint-placeholder-count="4">
<section style="background: #FFFFFF; border-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.18); display: flex; flex-direction: column; font-family: {{f.css}}">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #F4F5F7">
<span style="font-size: 15px; font-weight: 700">{{f.name}}</span>
<span style="font-size: 12px; color: #5E6670">{{f.note}}</span>
</div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 22px; font-weight: 700">햄릿 정기공연</span>
<span style="font-size: 16px; font-weight: 700">조명 정보</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; font-weight: 700">
<span style="border: 1px solid #D5D8DD; border-radius: 6px; padding: 3px 9px">조명기 라이브러리</span>
<span style="border: 1px solid #D5D8DD; border-radius: 6px; padding: 3px 9px">채널 패치</span>
<span style="border: 1px solid #D5D8DD; border-radius: 6px; padding: 3px 9px">밝기 Probe</span>
</div>
<span style="font-size: 14px; line-height: 1.6">빨간 타겟을 끌어 조준점을 옮깁니다. | Shift = 축 방향 고정</span>
<span style="font-size: 13px; color: #5E6670">마지막 수정: 2026. 10. 19. · 씬 12 · 조명 34</span>
<span style="font-size: 14px">Tilt 42.5° · Pan 90.0° · 1234567890</span>
</div>
</section>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const fonts = [
{ name: 'Noto Sans KR', note: '기본값 · 가장 중립적' },
{ name: 'IBM Plex Sans KR', note: '기술 도구 느낌 · 단단함' },
{ name: 'Nanum Gothic', note: '친숙함 · 약간 둥근 획' },
{ name: 'Gothic A1', note: '얇고 현대적 · 획 대비 작음' }
];
return { fonts: fonts.map(function (f) { return { name: f.name, note: f.note, css: "'" + f.name + "', sans-serif" }; }) };
}
}
</script>
</body>
</html>
