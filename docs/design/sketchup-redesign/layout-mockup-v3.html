<style>
/* Layout: SketchUp Web식 — 캔버스가 화면 전체, 그 위에 떠 있는 파일 알약(왼쪽 위)·도구 레일(왼쪽)·패널 트레이(오른쪽)·씬 서랍(아래), 아래 상태 바, 그 아래 설명 콘솔 */
:root {
  --page: #dfe3e8;
  --canvas: #eef1f4;
  --canvas-grid: #d9dee4;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --line: #d3d9e0;
  --ink: #1d2733;
  --ink-2: #5b6878;
  --ink-3: #8a96a4;
  --accent: #1f6fd1;
  --accent-soft: #e3eefc;
  --plan-line: #6d7988;
  --seat: #d6cfc6;
  --actor: #2d8a57;
  --console-bg: #18202a;
  --console-ink: #d7e0ea;
  --console-dim: #8494a6;
  --console-key: #8cc2ff;
  --console-new: #ffd27a;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "D2Coding", ui-monospace, Consolas, monospace;
  --shadow: 0 1px 2px rgba(20, 30, 45, .08), 0 4px 14px rgba(20, 30, 45, .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #10151b; --canvas: #1a2129; --canvas-grid: #242d37; --surface: #222b35; --surface-2: #2a3440;
    --line: #36414e; --ink: #e4eaf0; --ink-2: #a5b1be; --ink-3: #75818f; --accent: #6aa8ff; --accent-soft: #1f3550;
    --plan-line: #8f9cab; --seat: #3a3530; --actor: #5cc58a;
    --console-bg: #0b1016; --console-ink: #d7e0ea; --console-dim: #7d8c9d; --console-key: #8cc2ff; --console-new: #ffd27a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #10151b; --canvas: #1a2129; --canvas-grid: #242d37; --surface: #222b35; --surface-2: #2a3440;
  --line: #36414e; --ink: #e4eaf0; --ink-2: #a5b1be; --ink-3: #75818f; --accent: #6aa8ff; --accent-soft: #1f3550;
  --plan-line: #8f9cab; --seat: #3a3530; --actor: #5cc58a;
  --console-bg: #0b1016; --console-ink: #d7e0ea; --console-dim: #7d8c9d; --console-key: #8cc2ff; --console-new: #ffd27a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--page); color: var(--ink); font-family: var(--font-ui); font-size: 13px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  display: flex; flex-direction: column; gap: 10px;
}
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.intro { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.intro h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.intro p { margin: 0; color: var(--ink-2); font-size: 12.5px; }

.frame-scroll { flex: 1; min-height: 0; overflow-x: auto; border-radius: 10px; }
.app {
  position: relative; height: 100%; min-height: 600px; min-width: 1000px;
  background: var(--canvas); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  display: grid; grid-template-rows: 1fr auto;
}

/* ---------- 캔버스 ---------- */
.canvas { position: relative; overflow: hidden; }
.canvas.tool-ellip, .canvas.tool-fresnel, .canvas.tool-par, .canvas.tool-set { cursor: crosshair; }
.plan-wrap { position: absolute; inset: 56px 200px 64px 70px; transition: transform .5s ease; transform-origin: 50% 60%; }
.app.is-3d .plan-wrap { transform: perspective(1100px) rotateX(52deg) scale(.92); }
.plan { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.badge-3d { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12px; color: var(--ink-2); box-shadow: var(--shadow); white-space: nowrap; }

.float { position: absolute; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 8px; }

/* 파일 알약 */
.filepill { top: 10px; left: 10px; display: flex; align-items: center; gap: 2px; padding: 4px 6px; }
.ibtn { width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--ink-2); }
.ibtn:hover { background: var(--surface-2); color: var(--ink); }
.ibtn svg { width: 18px; height: 18px; }
.filename { font-weight: 700; font-size: 14px; padding: 0 8px; border: 0; background: none; cursor: pointer; }
.savestate { color: var(--ink-3); font-size: 12px; padding: 0 8px 0 4px; border: 0; background: none; cursor: pointer; }

/* 2D/3D 전환 */
.viewswitch { top: 10px; left: 50%; transform: translateX(-50%); display: flex; padding: 3px; border-radius: 999px; }
.viewswitch button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.viewswitch button[aria-pressed="true"] { background: var(--accent); color: #fff; }

/* 오른쪽 위 계정 */
.account { top: 10px; right: 10px; display: flex; align-items: center; gap: 4px; padding: 4px 6px; }
.pillbtn { height: 28px; padding: 0 10px; border-radius: 999px; border: 0; background: var(--surface-2); color: var(--ink-3); font-size: 12px; cursor: pointer; white-space: nowrap; }

/* 왼쪽 도구 레일 */
.toolrail { top: 58px; left: 10px; width: 46px; padding: 5px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.toolrail .sep { width: 26px; height: 1px; background: var(--line); margin: 4px 0; }
.tool { position: relative; width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--ink-2); }
.tool:hover { background: var(--surface-2); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.tool:disabled { opacity: .35; cursor: not-allowed; }
.tool svg { width: 20px; height: 20px; }
.tool .key { position: absolute; right: 2px; bottom: 1px; font: 500 8.5px var(--font-mono); color: var(--ink-3); }
.tool .tip { position: absolute; left: 44px; top: 50%; transform: translateY(-50%); background: var(--ink); color: var(--surface); padding: 3px 8px; border-radius: 4px; font-size: 11.5px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 5; }
.tool:hover .tip { opacity: 1; }
.tool .more { position: absolute; right: 3px; top: 3px; width: 0; height: 0; border-left: 4px solid transparent; border-top: 4px solid var(--ink-3); transform: rotate(90deg); }
.toolwrap { position: relative; }
/* 엘립소이달 렌즈 고르기: 버튼 바로 옆으로 펼쳐진다 */
.flyout { position: absolute; left: 44px; top: -4px; display: flex; gap: 3px; padding: 4px; z-index: 6; }
.flyout button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 5px; padding: 5px 9px; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; }
.flyout button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.flyout button small { display: block; font-weight: 400; font-size: 10px; color: var(--ink-3); }
.flyout button[aria-pressed="true"] small { color: rgba(255,255,255,.8); }

/* 오른쪽 패널 트레이 */
.tray { position: absolute; top: 58px; right: 10px; display: flex; flex-direction: column; gap: 5px; padding: 2px; }
.tray .grp { font: 600 10px var(--font-ui); letter-spacing: .06em; color: var(--ink-3); text-align: right; padding: 6px 4px 0; }
.trayitem { display: flex; align-items: center; justify-content: flex-end; gap: 6px; border: 0; background: none; padding: 0; cursor: pointer; }
.trayitem .lbl { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; font-size: 12px; font-weight: 600; color: var(--ink); box-shadow: var(--shadow); white-space: nowrap; }
.trayitem .ico { width: 38px; height: 38px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; box-shadow: var(--shadow); color: var(--ink-2); }
.trayitem .ico svg { width: 19px; height: 19px; }
.trayitem[aria-expanded="true"] .ico { background: var(--accent); border-color: var(--accent); color: #fff; }
.trayitem[aria-expanded="true"] .lbl { color: var(--accent); }

/* 열린 패널들: 트레이 왼쪽에 세로로 쌓인다 */
.panelcol { position: absolute; top: 58px; right: 196px; bottom: 64px; width: 300px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; pointer-events: none; padding-bottom: 4px; }
.panel { position: relative; pointer-events: auto; flex: none; }
.panel.drop { animation: drop .22s ease-out; border-color: var(--accent); }
@keyframes drop { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
.panel header { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.panel header h2 { margin: 0; font-size: 14px; }
.panel header .scope { font-size: 11px; color: var(--ink-3); }
.panel .body { padding: 10px 12px 12px; display: grid; gap: 9px; }
.field { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px; }
.field > span { color: var(--ink-2); font-size: 12px; }
.v { border: 1px solid var(--line); background: var(--surface-2); border-radius: 5px; padding: 4px 8px; font-variant-numeric: tabular-nums; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 6px; min-width: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.sub { font: 600 11px var(--font-ui); color: var(--ink-3); letter-spacing: .04em; }
.sw { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); flex: none; display: inline-block; }
.list { display: grid; gap: 2px; }
.li { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 5px 6px; border-radius: 5px; cursor: pointer; text-align: left; width: 100%; }
.li:hover { background: var(--surface-2); }
.li.sel { background: var(--accent-soft); }
.li small { color: var(--ink-3); margin-left: auto; font-variant-numeric: tabular-nums; }
.tree-h { font-weight: 600; cursor: default; }
.indent { padding-left: 20px; }
.toggle { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 2px; cursor: pointer; text-align: left; }
.toggle .box { width: 28px; height: 16px; border-radius: 999px; background: var(--line); position: relative; flex: none; }
.toggle .box::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.toggle.on .box { background: var(--accent); }
.toggle.on .box::after { left: 14px; }
.geltray { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.geltray button { height: 22px; border-radius: 4px; border: 1px solid var(--line); cursor: pointer; padding: 0; color: var(--ink-3); font-size: 11px; }
.geltray button.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.slider .track { height: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--accent) var(--p), var(--line) var(--p)); cursor: pointer; border: 0; padding: 0; }
.big { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.patch { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.patch button { border: 1px solid var(--line); border-radius: 3px; padding: 3px 0; font: 500 10px var(--font-mono); background: var(--surface-2); cursor: pointer; color: var(--ink-2); }
.patch .used { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.patch .over { background: #fde4e1; color: #b3261e; border-color: #e7a59e; }
.note { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; margin: 0; }
.empty { color: var(--ink-3); font-size: 12px; line-height: 1.5; margin: 0; }

/* 아래 씬 서랍 */
/* 왼쪽 도구 레일과 오른쪽 패널 사이에 놓아 서로 겹치지 않게 한다 */
.scenes { position: absolute; left: 70px; right: 510px; bottom: 10px; display: flex; flex-direction: column; }
.scenes-handle { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 7px 12px; cursor: pointer; width: 100%; text-align: left; }
.scenes-handle b { font-size: 13px; }
.scenes-handle small { color: var(--ink-3); margin-left: auto; }
.scenes-handle .chev { color: var(--ink-3); transition: transform .2s; width: 16px; height: 16px; flex: none; }
.scenes.open .chev { transform: rotate(180deg); }
.scenes-body { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 10px; }
.scene-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.scene-card { flex: none; width: 128px; border: 1px solid var(--line); border-radius: 6px; padding: 5px; background: var(--surface-2); cursor: pointer; text-align: left; }
.scene-card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.scene-card i { display: block; height: 60px; border-radius: 4px; margin-bottom: 4px; }
.scene-card b { font-size: 12px; display: block; }
.scene-card small { color: var(--ink-3); font-size: 11px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.sbtn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 12px; }

/* 상태 바 */
.statusbar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-top: 1px solid var(--line); background: var(--surface); min-width: 0; }
.statusbar .hint { flex: 1; min-width: 0; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 0; background: none; text-align: left; cursor: pointer; padding: 0; }
.statusbar .coord { font: 500 12px var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; border: 0; background: none; cursor: pointer; white-space: nowrap; }
.vcb { display: flex; align-items: center; gap: 6px; }
.vcb label { color: var(--ink-2); font-size: 12px; }
.vcb input { width: 120px; border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; background: var(--surface-2); color: var(--ink); font: 500 12px var(--font-mono); }
.zoom { border: 1px solid var(--line); background: var(--surface-2); border-radius: 4px; padding: 3px 8px; cursor: pointer; font: 500 12px var(--font-mono); }

/* 설명 콘솔 */
.console { height: 200px; flex: none; background: var(--console-bg); color: var(--console-ink); border-radius: 10px; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.console header { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,.08); font: 500 12px var(--font-mono); color: var(--console-dim); }
.console header b { color: var(--console-ink); font-weight: 600; flex: none; }
.console header span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.console header button { margin-left: auto; border: 1px solid rgba(255,255,255,.15); background: none; color: var(--console-dim); border-radius: 4px; padding: 2px 8px; cursor: pointer; font: 500 11px var(--font-mono); flex: none; }
.log { overflow-y: auto; padding: 8px 12px; font: 400 12.5px/1.6 var(--font-mono); }
.entry { padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,.08); }
.entry:last-child { border-bottom: 0; }
.entry .h { color: var(--console-key); }
.entry .h em { font-style: normal; color: var(--console-dim); }
.entry .k { color: var(--console-dim); display: inline-block; min-width: 9.5em; }
.entry .new { color: var(--console-new); }
.entry div { white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }

/* 평면도 대상 */
.hit { cursor: pointer; }
.fx-body { fill: var(--surface); stroke: var(--ink); stroke-width: .05; }
.fx.sel .fx-body { stroke: var(--accent); stroke-width: .1; }
.fx-label { font: 600 .42px var(--font-ui); fill: var(--ink); }
.plan text { user-select: none; }
.seln { stroke: var(--accent); stroke-width: .05; stroke-dasharray: .2 .15; fill: none; }
/* 세트 크기·회전 손잡이 (파워포인트 도형처럼) */
.h-corner { fill: var(--surface); stroke: var(--accent); stroke-width: .05; cursor: nwse-resize; }
.h-rot { fill: #f5c400; stroke: #8a6d00; stroke-width: .04; cursor: grab; }
.h-rotline { stroke: var(--accent); stroke-width: .035; }
.set-body { cursor: move; }

@media (prefers-reduced-motion: reduce) { .plan-wrap, .toggle .box::after, .scenes .chev { transition: none; } .panel.drop { animation: none; } }
</style>

<div class="intro">
  <h1>조명 도우미 화면 배치 시안</h1>
  <p>3차 시안. 아무 요소나 누르면 아래 콘솔에 설명이 나옵니다. 왼쪽 도구로 조명이나 덧마루를 놓아 보고, 세트를 골라 손잡이를 끌어 보세요.</p>
</div>

<div class="frame-scroll">

        </g>
        <g class="hit" data-k="seating">

            <line x1="2" x2="10" y1="12.1" y2="12.1"/><line x1="2" x2="10" y1="13" y2="13"/><line x1="2" x2="10" y1="13.9" y2="13.9"/>
            <line x1="2" x2="10" y1="14.8" y2="14.8"/><line x1="2" x2="10" y1="15.7" y2="15.7"/>

    document.getElementById('sets').innerHTML = SETS.map(s => {
      const on = sel.type === 'set' && sel.id === s.id;
      // 벽처럼 아주 얇은 세트도 평면에서 보이고 잡을 수 있게 그림은 최소 8cm로 그린다
      const dv = Math.max(s.d, .08);
      const inside = dv > .5 && s.w > 1;
      const fill = s.kind === 'wall' ? '#5f6a76' : s.kind === 'apple' ? '#b08a5a' : '#8a7461';
      const handles = on && !is3d ? `
        <line class="h-rotline" x1="${s.x}" y1="${s.y - dv / 2}" x2="${s.x}" y2="${s.y - dv / 2 - .55}"/>
        <circle class="h-rot" data-handle="rot" cx="${s.x}" cy="${s.y - dv / 2 - .55}" r=".14"/>
        ${[[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sy], i) => `<circle class="h-corner" data-handle="c${i}" cx="${s.x + sx * s.w / 2}" cy="${s.y + sy * dv / 2}" r=".12"/>`).join('')}` : '';
      return `<g data-set="${s.id}" class="hit" transform="rotate(${s.r} ${s.x} ${s.y})">
        <rect class="set-body" x="${s.x - s.w / 2}" y="${s.y - dv / 2}" width="${s.w}" height="${dv}" fill="${fill}" opacity=".82" stroke="${on ? 'var(--accent)' : '#4a3b2e'}" stroke-width="${on ? .06 : .03}"/>
        <text x="${s.x}" y="${inside ? s.y + .12 : s.y + dv / 2 + .36}" text-anchor="middle" font-size=".3" fill="${inside ? '#fff' : 'var(--ink-2)'}">${s.name} · ${Math.round(s.h * 1000)}</text>
        ${handles}
      </g>`;
    }).join('');
    document.getElementById('fixtures').innerHTML = FIXTURES.map(f => {
      const ang = Math.atan2(f.ty - f.y, f.tx - f.x) * 180 / Math.PI;
      const on = sel.type === 'fx' && sel.id === f.id;
      const body = f.type === 'fresnel' ? '<rect class="fx-body" x="-.26" y="-.24" width=".52" height=".48" rx=".1"/>'
        : f.type === 'par' ? '<rect class="fx-body" x="-.26" y="-.2" width=".52" height=".4" rx=".2"/>'
        : '<rect class="fx-body" x="-.34" y="-.17" width=".68" height=".34" rx=".05"/>';
      return `<g class="fx hit ${on ? 'sel' : ''}" data-fx="${f.id}">
        <g transform="translate(${f.x} ${f.y}) rotate(${ang})">${body}<rect x=".24" y="-.13" width=".1" height=".26" fill="${gelHex(f.gel)}" stroke="var(--ink)" stroke-width=".02"/></g>
        <text class="fx-label" x="${f.x}" y="${f.y - .42}" text-anchor="middle">${f.id}·${f.ch ?? '—'}</text>

    line.toggleAttribute('hidden', !f);
    dot.toggleAttribute('hidden', !f);
    if (f) { line.setAttribute('x1', f.x); line.setAttribute('y1', f.y); line.setAttribute('x2', f.tx); line.setAttribute('y2', f.ty); dot.setAttribute('cx', f.tx); dot.setAttribute('cy', f.ty); }

  };

  const field = (label, value, k = 'field') => `<div class="field"><span>${label}</span><button class="v" data-k="${k}" data-label="${label}">${value}</button></div>`;
  const toggleRow = (label) => `<button class="toggle ${toggles[label] ? 'on' : ''}" data-toggle="${label}"><span class="box"></span>${label}</button>`;

  /* 조명 설정: 조명을 누를 때마다 내려오는 패널 (기종·렌즈, 젤, 디머, 셔터, 3D 그림자) */
  const settingsPanel = (f) => {

          <p class="note">1~40번만 보이는 시안입니다. 13번은 콘센트 2개에 조명 3개가 물려 빨간색입니다.</p>`;

    display: { what: '화면에 무엇을 보일지 정한다. 2D와 3D 설정을 한곳에 모았다.', act: '스위치를 켜고 끄면 무대에 바로 반영된다.', now: 'G1 왼쪽 "전체 보기 옵션", H3 3D 체크박스' },
    layers: { what: '극장 도면과 씬별 배경 이미지.', act: '켜고 끄고 투명도를 바꾼다.', now: 'B5 도면 토글, C4 배경 이미지' },
    patch: { what: '91개 디머 채널 사용 현황과 콘센트 초과 경고.', act: '빨간 칸을 누르면 그 채널을 쓰는 조명 목록이 뜬다.', now: 'F4 채널 사용 현황' },
    venue: { what: '작업 전체에 쓰이는 기본값.', act: '바꾸면 모든 씬 계산에 적용된다.', now: 'B1~B3 헤더 입력칸, B4 램프 선택' },
    props: { what: '선택한 객체의 기본 정보. 조명이면 이름·채널·위치·조준점, 세트면 크기·높이·회전, 사람 모형이면 위치·의상 색과 밝기.', act: '조명을 누르면 이 패널은 닫히고 "조명 설정"이 대신 내려온다(두 패널이 겹치지 않게). 조명의 이름·채널·위치를 고칠 때 이 패널을 연다.', now: 'D4~D5, E2, F1~F3 (조명 이름 바꾸기와 조준점 숫자 입력은 새 기능)' },
    list: { what: '무대 위에 놓인 조명·세트·사람 모형 목록.', act: '줄을 누르면 무대에서 선택된다. 눈 아이콘으로 숨기고, 휴지통으로 지운다.', now: 'D2 조명 목록, E1 세트 목록' },
    help: { what: '지금 도구의 사용법과 단축키.', act: '도구를 바꾸면 내용이 따라 바뀐다.', now: '없음', isNew: true }
  };

  /* ---------- 동작 ---------- */
  const setTool = (id, fromKey) => {
    const t = toolById[id];
    if (!t) return;
    if (is3d && id !== 'select') {
      write({ h: `[도구] ${t.name}`, sub: '3D에서는 쓸 수 없음', act: '위쪽 "2D 평면"으로 바꾸면 켜진다. 3D는 보는 화면이라 선택 도구만 쓴다.' });
      return;
    }
    // 엘립소이달 버튼을 누르면 옆에 렌즈 고르기가 펼쳐진다 (키보드 E는 마지막 렌즈로 바로 켠다)
    flyoutOpen = id === 'ellip' && !fromKey ? !(tool === 'ellip' && flyoutOpen) : false;
    tool = id;
    renderAll();
    const lens = id === 'ellip' ? ` · 지금 렌즈 ${ellipKind.replace('Source Four ', '')}` : '';
    write({ h: `[도구] ${t.name} (${t.key})`, sub: `${fromKey ? '키보드로 바꿈' : ''}${lens}`, what: t.what, act: t.act, now: t.now, isNew: t.isNew });
  };

  const backToSelect = () => { tool = 'select'; flyoutOpen = false; };

  const selectFx = (id, how) => {
    dropNext = !(sel.type === 'fx' && sel.id === id && settingsOpen);
    sel = { type: 'fx', id };
    settingsOpen = true;
    trayOpen = null; // 조명 설정이 내려오면 오른쪽 트레이에서 연 패널은 닫는다
    renderAll();
    const f = selFx();
    write({ h: `[무대] 조명 ${f.id} (${f.kind})`, sub: how,
      what: `채널 ${f.ch ?? '비어 있음'}, 디머 ${f.dim}%, ${f.gel ? `젤 L${f.gel}` : '젤 없음'}.`,
      act: '오른쪽 위에서 "조명 설정" 패널이 내려와 기종·렌즈, 젤, 디머, 셔터, 3D 그림자를 바로 바꿀 수 있다. 트레이에서 열어 둔 패널은 겹치지 않게 닫힌다. 이름·채널·위치·조준점은 "선택한 객체 속성"에 있다.',
      now: 'D2 선택 + D4~D10 오른쪽 아래 속성 칸 (한 패널에 모두 있었음)' });
  };

  const selectSet = (id, how) => {
    sel = { type: 'set', id };
    trayOpen = 'props'; settingsOpen = false;
    renderAll();
    const s = selSet();
    write({ h: `[무대] 세트 "${s.name}"`, sub: how, what: `${Math.round(s.w * 1000)} × ${Math.round(s.d * 1000)} mm, 높이 ${Math.round(s.h * 1000)} mm.`, act: '네 꼭짓점에 동그란 손잡이, 위쪽에 노란 회전 손잡이가 생긴다(파워포인트 도형처럼). 몸통을 끌면 옮겨지고, "선택한 객체 속성"이 열린다.', now: 'E1~E3 왼쪽 "세트" 패널 + 캔버스 끌기 (손잡이로 크기·각도 바꾸기는 새 기능)', isNew: true });
  };

  const svgPoint = (e) => {
    const plan = document.getElementById('plan');
    const pt = plan.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const m = plan.getScreenCTM();
    return m ? pt.matrixTransform(m.inverse()) : null;
  };

  /* 놓기 도구: 조명은 가까운 파이프에, 세트는 누른 자리에 놓는다. 놓은 뒤에는 선택 도구로 돌아온다 */
  const placeAt = (e) => {
    const p = svgPoint(e);
    if (!p) return;
    const t = toolById[tool];
    const x = Math.round(Math.min(10.5, Math.max(1.5, p.x)) * 10) / 10;
    if (t.preset) {
      const pr = SET_PRESETS[t.preset];
      setCount[t.preset] += 1;
      const id = `S${SETS.length + 1}`;
      SETS.push({ id, kind: t.preset, name: `${pr.name}${setCount[t.preset]}`, x, y: Math.round(Math.min(19, Math.max(.5, p.y)) * 100) / 100, w: pr.w, d: pr.d, h: pr.h, r: 0 });
      backToSelect();
      sel = { type: 'set', id }; trayOpen = 'props'; settingsOpen = false;
      renderAll();
      const s = selSet();
      write({ h: `[${t.name}] 새 세트 "${s.name}"`, sub: '선택 도구로 돌아옴', what: `${Math.round(s.w * 1000)} × ${Math.round(s.d * 1000)} × ${Math.round(s.h * 1000)} mm. 벽·덧마루·애플박스도 모두 같은 "세트" 객체다.`, act: t.preset === 'set' ? '실제로는 끌어서 크기를 정하고 아래 "수치" 칸에 높이를 친다. 시안에서는 누른 자리에 2 × 1 m를 바로 만들었다.' : '손잡이로 크기와 각도를 고치고, 높이는 "선택한 객체 속성"에서 바꾼다.', now: t.now, isNew: t.isNew });
      return;
    }
    const pipe = PIPES.reduce((a, b) => Math.abs(b - p.y) < Math.abs(a - p.y) ? b : a);
    const id = `L${FIXTURES.length + 1}`;
    const kind = tool === 'ellip' ? ellipKind : t.kind;
    FIXTURES.push({ id, ch: null, x, y: pipe, tx: x, ty: Math.max(4, pipe - 4), type: tool, kind, gel: null, dim: 100, shutter: false, shadow: false });
    backToSelect();
    sel = { type: 'fx', id }; settingsOpen = true; dropNext = true; trayOpen = null;
    renderAll();
    write({ h: `[${t.name}] 새 조명 ${id}`, sub: `Y ${pipe} m 파이프에 붙음 · 선택 도구로 돌아옴`, what: `${kind}, 채널은 비어 있고 디머 100%.`, act: '오른쪽 위에서 "조명 설정" 패널이 내려와 바로 기종·젤·디머를 고른다. 하나 더 놓으려면 도구를 다시 고른다.', now: 'D1 "+ 추가" 뒤 속성 칸을 따로 찾아 열어야 했음' });
  };

  /* 세트 끌기: 몸통은 이동, 동그란 꼭짓점은 크기(반대쪽 꼭짓점 고정), 노란 손잡이는 회전 */
  let suppressClick = false;
  let drag = null;
  const planEl = document.getElementById('plan');
  planEl.addEventListener('pointerdown', (e) => {
    if (tool !== 'select' || is3d || e.button !== 0) return;
    const handle = e.target.closest('[data-handle]');
    const body = e.target.closest('[data-set]');
    if (!handle && !body) return;
    const s = handle ? selSet() : SETS.find(x => x.id === body.dataset.set);
    const p = svgPoint(e);
    if (!s || !p) return;
    drag = { mode: handle ? handle.dataset.handle : 'move', s, start: p, moved: false, ox: p.x - s.x, oy: p.y - s.y };
    planEl.setPointerCapture(e.pointerId);
  });
  planEl.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const p = svgPoint(e);
    if (!p) return;
    if (!drag.moved && Math.hypot(p.x - drag.start.x, p.y - drag.start.y) < .05) return;
    drag.moved = true;
    const s = drag.s;
    const r = s.r * Math.PI / 180, c = Math.cos(r), sn = Math.sin(r);
    if (drag.mode === 'move') {
      s.x = p.x - drag.ox; s.y = p.y - drag.oy;
    } else if (drag.mode === 'rot') {
      let a = Math.round(Math.atan2(p.y - s.y, p.x - s.x) * 180 / Math.PI + 90);
      const snap = Math.round(a / 15) * 15;
      if (Math.abs(a - snap) <= 3) a = snap; // 15° 근처에서는 딱 맞춘다
      s.r = ((a + 180) % 360 + 360) % 360 - 180;
    } else {
      const [sx, sy] = [[-1, -1], [1, -1], [1, 1], [-1, 1]][Number(drag.mode.slice(1))];
      const dx = p.x - s.x, dy = p.y - s.y;
      const lx = dx * c + dy * sn, ly = -dx * sn + dy * c;
      const ox = -sx * s.w / 2, oy = -sy * s.d / 2;
      const mx = (lx + ox) / 2, my = (ly + oy) / 2;
      s.w = Math.max(.05, Math.abs(lx - ox));
      s.d = Math.max(.02, Math.abs(ly - oy));
      s.x += mx * c - my * sn; s.y += mx * sn + my * c;
    }
    if (!(sel.type === 'set' && sel.id === s.id)) { sel = { type: 'set', id: s.id }; trayOpen = 'props'; settingsOpen = false; }
    renderPlan(); renderPanels(); renderTray();
  });
  planEl.addEventListener('pointerup', () => {
    if (!drag) return;
    const { mode, s, moved } = drag;
    drag = null;
    if (!moved) return;
    suppressClick = true;
    const mm = (v) => Math.round(v * 1000).toLocaleString('ko-KR');
    if (mode === 'move') write({ h: `[무대] 세트 "${s.name}" 옮김`, sub: `X ${s.x.toFixed(2)} · Y ${s.y.toFixed(2)} m`, act: '몸통을 끌면 그대로 옮겨진다. 끄는 중에 아래 "수치" 칸에 거리를 치면 정확히 옮긴다.', now: 'E3 캔버스 끌기' });
    else if (mode === 'rot') write({ h: `[무대] 노란 회전 손잡이 → ${Math.round(s.r)}°`, act: '끌면 중심을 기준으로 돌아가고, 15° 단위 근처에서는 딱 맞춰진다.', now: 'E2 회전 숫자 입력만 있었음', isNew: true });
    else write({ h: `[무대] 크기 손잡이 → ${mm(s.w)} × ${mm(s.d)} mm`, act: '끈 꼭짓점의 반대쪽 꼭짓점은 제자리에 두고 크기가 바뀐다(파워포인트 도형과 같음). 높이는 "선택한 객체 속성"에서 바꾼다.', now: 'E2 폭·깊이 숫자 입력만 있었음', isNew: true });
  });

  document.addEventListener('click', (e) => {
    if (suppressClick) { suppressClick = false; return; }
    const target = e.target;
    const lensBtn = target.closest('[data-lens]');
    if (lensBtn) {
      ellipKind = lensBtn.dataset.lens;
      flyoutOpen = false;
      tool = 'ellip';
      renderAll();
      write({ h: `[엘립소이달 놓기] 렌즈 ${ellipKind.replace('Source Four ', '')}`, what: '버튼 옆에 펼쳐진 렌즈 고르기.', act: `이제 무대를 누르면 ${ellipKind}이(가) 놓인다. 줌은 놓은 뒤 "조명 설정"에서 각도(15~30°, 25~50°)를 정한다.`, now: 'D6 렌즈 고르기 (조명을 만든 뒤 속성에서 따로 골랐음)' });
      return;
    }
    const toolBtn = target.closest('[data-tool]');
    if (toolBtn) { setTool(toolBtn.dataset.tool); return; }

    const close = target.closest('[data-close]');
    if (close) {
      if (close.dataset.close === 'settings') { settingsOpen = false; write({ h: '[패널] 조명 설정 닫기', act: '다른 조명을 누르면 다시 내려온다.' }); }
      else trayOpen = null;
      renderAll(); return;
    }

    const trayBtn = target.closest('[data-tray]');
    if (trayBtn) {
      const id = trayBtn.dataset.tray;
      trayOpen = trayOpen === id ? null : id;
      if (trayOpen) settingsOpen = false; // 트레이 패널을 열면 조명 설정은 접어서 겹치지 않게 한다
      renderAll();
      write({ h: `[패널] ${id === 'props' ? propsTitle() : TRAY.find(x => x.id === id).name}`, sub: trayOpen ? '열림' : '닫힘', ...PANEL_INFO[id] });
      return;
    }

    const gelBtn = target.closest('[data-gel]');
    if (gelBtn) {
      const f = selFx();
      if (!f) return;
      f.gel = gelBtn.dataset.gel || null;
      renderAll();
      const g = gelOf(f.gel);
      write({ h: `[조명 설정] 젤 → ${g ? `L${g[0]} ${g[1]}` : '젤 없음'}`, what: '극장 보유 LEE 11종(텅스텐 3200K 기준 색·투과율).', act: `${f.id}에 바로 끼워지고, 무대의 빛 색과 밝기가 함께 바뀐다.`, now: 'D7 조명 속성의 젤 목록 (젤 견본 패널은 없애고 여기로 합침)' });
      return;
    }

    const tog = target.closest('[data-toggle]');
    if (tog) {
      const label = tog.dataset.toggle;
      toggles[label] = !toggles[label];
      renderPanels();
      write({ h: `[보기] ${label}`, sub: toggles[label] ? '켬' : '끔', act: label.includes('3D') ? '3D 화면에서 바로 나타나거나 사라진다.' : '2D 평면도에서 바로 나타나거나 사라진다.', now: label.includes('3D') ? 'H3 3D 화면 왼쪽 위 체크박스' : 'G1 왼쪽 "전체 보기 옵션"' });
      return;
    }

    const sceneCard = target.closest('[data-scene]');
    if (sceneCard) {
      sceneIdx = Number(sceneCard.dataset.scene);
      renderScenes();
      write({ h: `[씬] ${SCENES[sceneIdx].name}`, act: '그 씬의 조명 구성으로 바뀐다. 카드를 끌면 순서가 바뀐다. 썸네일은 자동으로 만든다.', now: 'C1~C3 왼쪽 위 씬 목록' });
      return;
    }

    const onStage = (el) => Boolean(el.closest('#plan'));
    const fx = target.closest('[data-fx]');
    if (fx) {
      if (tool !== 'select' && onStage(fx)) { placeAt(e); return; }
      selectFx(fx.dataset.fx, onStage(fx) ? '선택 도구로 누름' : '목록에서 고름');
      return;
    }
    const st = target.closest('[data-set]');
    if (st) {
      if (tool !== 'select' && onStage(st)) { placeAt(e); return; }
      selectSet(st.dataset.set, onStage(st) ? '선택 도구로 누름' : '목록에서 고름');
      return;
    }

    const kEl = target.closest('[data-k]');
    if (!kEl) return;
    const k = kEl.dataset.k;

    if (k === 'actor') {
      if (tool !== 'select' && onStage(kEl)) { placeAt(e); return; }
      sel = { type: 'actor' };
      trayOpen = 'props';
      renderAll();
      write({ h: '[무대] 사람 모형', what: '배우가 서는 자리. 이 자리의 얼굴 밝기를 계산하고, 무대 위에 "얼굴 642 lux"를 늘 붙여 둔다.', act: '"선택한 사람 모형" 패널이 열리고, 얼굴·수평면 lux와 조명별 기여도가 나온다. 끌면 옮겨진다.', now: 'F1~F3 오른쪽 "밝기 Probe" 패널 (밝기 측정 패널은 없애고, 사람 모형을 누르면 보이게 함)' });
      return;
    }
    if (k === 'view2d' || k === 'view3d') {
      is3d = k === 'view3d';
      document.getElementById('app').classList.toggle('is-3d', is3d);
      document.getElementById('badge3d').hidden = !is3d;
      document.querySelectorAll('.viewswitch button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.k === 'view3d') === is3d)));
      if (is3d) tool = 'select';
      renderAll();
      write(INFO[k]);
      return;
    }
    if (k === 'scenes-handle') {
      scenesOpen = !scenesOpen;
      renderScenes();
      write({ h: '[아래] 씬 서랍', sub: scenesOpen ? '올라옴' : '닫힘', what: '공연 순서대로 놓인 씬 목록. 평소에는 지금 씬 이름만 보이는 얇은 막대다.', act: '누르면 썸네일 목록이 올라오고, 다시 누르면 내려간다. 목록에서 씬을 바꾸고, 추가·복사·이름 변경·삭제를 한다.', now: 'C1~C3 왼쪽 위 씬 목록 (항상 펼쳐져 있었음)' });
      return;
    }
    if (k === 'canvas') {
      if (target.closest('.float, .tray, .panelcol')) return;
      if (tool === 'select') {
        write({ h: '[무대] 빈 바닥', sub: '선택 도구', act: is3d ? '끌면 3D 시점이 돈다.' : '선택이 풀리고 "조명 설정" 패널이 닫힌다. 끌면 화면이 움직인다.', now: 'G3 빈 곳 끌기' });
        if (!is3d) { sel = { type: null }; settingsOpen = false; renderAll(); }
        return;
      }
      placeAt(e);
      return;
    }
    const simple = {
      field: () => ({ h: `[${propsTitle()}] ${kEl.dataset.label}`, act: '누르면 바로 입력칸이 된다. 엔터를 치면 적용되고 무대와 밝기가 함께 바뀐다.', now: kEl.dataset.label.startsWith('조준점') ? 'D3 끌기만 있었음 → 숫자 입력 새로 만듦' : kEl.dataset.label === '이름' ? '조명 이름 바꾸기는 없었음' : 'D4~D5 오른쪽 속성 칸', isNew: kEl.dataset.label.startsWith('조준점') || kEl.dataset.label === '이름' }),
      'set-kind': () => ({ h: '[조명 설정] 기종·렌즈', act: '목록이 열려 렌즈 각도(또는 프레넬 포커스, PAR 램프)를 고른다. 빛 크기와 밝기가 사양서 값으로 바로 바뀐다.', now: 'D5 종류, D6 광학' }),
      'set-focus': () => ({ h: '[조명 설정] 프레넬 포커스', act: '막대를 끌어 좁게(빔 9°)~넓게(빔 52°) 사이를 고른다.', now: 'D6 프레넬 포커스' }),
      'set-rotate': () => ({ h: '[조명 설정] PAR 회전', act: 'PAR64의 긴 빛 방향을 돌린다. 숫자를 치거나 무대의 회전 손잡이를 끈다.', now: 'D6 PAR 회전 입력' }),
      'set-gel': () => ({ h: '[조명 설정] 젤', act: '아래 색 칸에서 바로 고른다. 이름 칸을 누르면 번호·이름·투과율이 적힌 목록이 열린다.', now: 'D7 젤 목록' }),
      'set-dim': () => ({ h: '[조명 설정] 디머', act: '막대를 끌어 0~100%를 정한다. 실제 광량은 제곱 법칙으로 계산된다(50% → 약 25%).', now: 'D8 디머 막대' }),
      'set-shutter': () => ({ h: '[조명 설정] 셔터', act: selFx()?.type === 'ellip' ? '켜면 무대에 빨간 꼭짓점 4개가 나타나고, 선택 도구로 끌어 빛을 자른다(셔터 도구는 따로 없음).' : '프레넬·PAR에는 셔터가 없어서 흐리게 보인다.', now: 'D9 셔터 컷 체크 + 꼭짓점 끌기' }),
      'set-shadow': () => ({ h: '[조명 설정] 3D 그림자', act: '켜면 3D에서 세트·객석·사람 모형이 이 조명을 가린 그림자가 보인다. 동시에 4개까지.', now: 'D10 3D 그림자 체크' }),
      layer: () => ({ h: `[레이어] ${kEl.dataset.label}`, act: kEl.dataset.label === '씬 배경 이미지' ? '이미지를 올리고 무대에서 끌어 위치와 크기를 맞춘다.' : '눈 아이콘으로 켜고 끄고, 줄을 누르면 투명도 막대가 열린다.', now: kEl.dataset.label === '씬 배경 이미지' ? 'C4 배경 이미지 패널' : 'B5 도면 레이어 토글' }),
      patchcell: () => ({ h: `[채널 검사] ${kEl.dataset.label}`, act: '이 채널을 쓰는 조명이 씬별로 목록에 뜨고, 누르면 그 조명이 선택된다.', now: 'F4 채널 사용 현황' }),
      sceneact: () => ({ h: `[씬] ${kEl.dataset.label}`, act: { '새 씬': '빈 씬이 끝에 생긴다.', '복사': '지금 씬을 바로 뒤에 복사한다(조명 구성 포함).', '이름 변경': '카드 이름이 바로 입력칸으로 바뀐다.', '삭제': '확인 문구를 보여 준 뒤 지운다. 실행 취소로 되돌릴 수 있다.' }[kEl.dataset.label], now: 'C2 씬 카드의 버튼' })
    };
    if (simple[k]) { write(simple[k]()); return; }
    if (INFO[k]) write(INFO[k]);
  });

  document.getElementById('plan').addEventListener('mousemove', (e) => {
    if (is3d) return;
    const p = svgPoint(e);
    if (p) document.getElementById('coord').textContent = `X ${p.x.toFixed(2)} m  Y ${p.y.toFixed(2)} m`;
  });

  const keymap = { ' ': 'select', e: 'ellip', f: 'fresnel', p: 'par', r: 'set', w: 'wall', d: 'deck', b: 'apple' };
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea, select')) return;
    const id = keymap[e.key.toLowerCase()];
    if (id) { e.preventDefault(); setTool(id, true); }
  });
  document.getElementById('vcb').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      write({ h: `[아래] 수치 입력 "${e.target.value || '(비어 있음)'}"`, act: tool === 'set' ? '방금 그린 세트의 높이(m)가 된다.' : '끌던 대상을 그 거리(m)만큼 정확히 옮긴다.', now: '없음', isNew: true });
      e.target.value = '';
    }
  });

  renderAll();
  write({ h: '3차 시안 사용법', what: '실제로 동작하지 않는 배치 시안이다. 요소를 누르면 여기에 설명이 나온다.', act: '왼쪽 엘립소이달 버튼을 누르면 렌즈가 옆에 펼쳐진다. 조명이나 세트를 놓으면 선택 도구로 돌아온다. 세트를 누르면 꼭짓점 손잡이(크기)와 노란 손잡이(회전)가 생기고, 시안에서도 실제로 끌린다.', now: '2차 시안에서 바뀐 점: 벽·덧마루·애플박스 놓기 추가, 엘립소이달 렌즈 펼침, 놓은 뒤 선택 도구로 복귀, 세트 손잡이, "선택한 객체 속성"으로 이름 변경, 조명 설정과 트레이 패널이 겹치지 않게 함.' });
})();
</script>

</body></html>
